services:
  unilab:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gui
    ports:
      - "8000:8000"
    volumes:
      - unilab-workspaces:/app/workspaces
    environment:
      - UNILAB_WORKSPACE_ROOT=/app/workspaces
      - LOG_LEVEL=INFO
    restart: unless-stopped

  unilab-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    volumes:
      - ../sample:/samples:ro
    restart: "no"

volumes:
  unilab-workspaces:
