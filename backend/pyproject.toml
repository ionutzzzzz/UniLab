[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilab"
version = "0.1.0"
description = "UniLab: Scientific Simulation & Modeling Platform (Offline Core Engine)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0.0",
    "sympy>=1.12",
    "Pillow>=10.2.0",
    "nest-asyncio>=1.6.0",
    "lark==1.3.1",
    "numpy>=1.26.0,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]
gui = [
    "PyQt5>=5.15.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
unilab = "backend.cli.app:main"

[tool.setuptools.package-dir]
backend = "."

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
